<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>抖动接口</title></head>
<body>
  <main>
    <h1>抖动接口</h1>
    <button id="load">加载</button>
    <div id="out">未加载</div>
  </main>
  <script>
    // 依赖 fixture server 的 /api/flaky-once：整个测试进程内第一次调用 500，之后 200
    document.getElementById("load").addEventListener("click", async () => {
      const r = await fetch("/api/flaky-once");
      const output = document.getElementById("out");
      output.textContent = r.ok ? "加载成功" : "加载失败";
      if (r.ok) output.dataset.ready = "true";
    });
  </script>
</body></html>
