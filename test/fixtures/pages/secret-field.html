<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>凭证字段</title></head>
<body>
  <main>
    <h1>访问验证</h1>
    <!-- 标签与 id 都不含敏感字样：只能靠 type=password 识别出这是凭证字段 -->
    <label for="code">访问码</label>
    <input id="code" type="password">
    <label for="nick">昵称</label>
    <input id="nick" type="text">
  </main>
</body></html>
