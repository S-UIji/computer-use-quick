<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>异步列表</title></head>
<body>
  <main>
    <h1>订单列表</h1>
    <button type="button" id="load">加载数据</button>
    <button type="button" id="timer">纯定时器刷新</button>
    <ul id="list"><li>尚未加载</li></ul>
  </main>
  <script>
    // 真实形态：走网络。请求在途 → 隐式等待能靠 network tracker 等到结果。
    document.getElementById("load").addEventListener("click", async () => {
      const list = document.getElementById("list");
      list.innerHTML = "<li>加载中…</li>";
      const res = await fetch("/api/orders");
      list.innerHTML = (await res.json()).map((o) => `<li>${o}</li>`).join("");
    });

    // 已知边界：纯 setTimeout 无任何在途信号，隐式等待检测不到，必须用显式 wait。
    document.getElementById("timer").addEventListener("click", () => {
      const list = document.getElementById("list");
      list.innerHTML = "<li>加载中…</li>";
      setTimeout(() => { list.innerHTML = "<li id='late'>定时器结果</li>"; }, 800);
    });
  </script>
</body></html>
