<!doctype html>
<html lang="zh">
  <head><meta charset="utf-8"><title>隐藏节点与可见节点</title></head>
  <body>
    <h1>隐藏节点与可见节点</h1>
    <p id="clicked">未点击</p>
    <!-- 模拟真实站点：第一条策略命中的元素其实是隐藏的 -->
    <button id="ghost" style="display:none">提交</button>
    <button id="real">提交</button>
    <script>
      document.getElementById("real").addEventListener("click", function () {
        document.getElementById("clicked").textContent = "点了可见按钮";
      });
    </script>
  </body>
</html>
