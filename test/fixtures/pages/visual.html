<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>视觉断言</title></head>
<body>
  <main>
    <h1>视觉断言</h1>
    <button id="toggle">切换样式</button>
    <div id="box" style="width:120px;height:80px;background:#3b82f6"></div>
  </main>
  <script>
    let on = false;
    document.getElementById("toggle").addEventListener("click", () => {
      on = !on;
      const box = document.getElementById("box");
      box.style.background = on ? "#ef4444" : "#3b82f6";
      box.style.width = on ? "160px" : "120px";
    });
  </script>
</body></html>
